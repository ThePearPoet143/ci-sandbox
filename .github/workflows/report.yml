name: report

on:
  workflow_run:
    workflows: [pr, tests]
    types: [completed]

permissions:
  contents: read
  checks: read
  statuses: read
  issues: write
  pull-requests: write

concurrency:
  group: report-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: ThePearPoet143/ci/.github/actions/report@v0.5.0
        with:
          pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          sha: ${{ github.event.workflow_run.head_sha }}
